    <path d="M122 78 C121 62 126 50 142 44 L148 54 C138 58 134 66 134 78 Z" fill="#17122A"/>
    <g fill="#17122A">
      <ellipse cx="84" cy="150" rx="48" ry="66"/>
      <ellipse cx="172" cy="150" rx="48" ry="66"/>
