name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # gofmt, vet for Linux and Windows, tests with the race detector
      - run: make test
      # staticcheck: unused code, suspicious constructs and style
      - run: make lint
      - name: Third-party notices are current
        run: make notices && git diff --exit-code THIRD_PARTY_NOTICES.txt

  # The only place the _windows.go code runs under test.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
