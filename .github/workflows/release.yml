name: Release

# A tag vX.Y.Z is what makes a release, whether it comes from `make release` or from the
# GitHub UI: the version in it is the version built, stamped and published. This workflow
# tests that commit, builds the Windows installer and the Linux tarball, and publishes them
# with checksums as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The tag is the version
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "a release tag looks like v1.2.3, not $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          echo "${GITHUB_REF_NAME#v}" > VERSION
      - run: make test
      # winres stamps the exe's version info from VERSION
      - run: make winres windows linux-dist
      - uses: actions/upload-artifact@v7
        with:
          name: exe
          path: bin/gourdian.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/gourdian-*-linux-x86_64.tar.gz
          if-no-files-found: error

  installer:
    needs: build
    runs-on: windows-latest
    # The signing certificate lives in this environment's secrets, which only v* tags can use.
    environment: release
    env:
      SIGN: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the version
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - uses: actions/download-artifact@v8
        with:
          name: exe
          path: bin
      - name: Load the signing certificate
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx
          # Trusted on this runner only, so the signatures can be checked below.
          $cer = Join-Path $env:RUNNER_TEMP 'sign.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
      - name: Find or install Inno Setup
        shell: pwsh
        run: |
          function Find-Iscc { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = Find-Iscc }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV
      - name: Build the installer
        # Windows PowerShell, not pwsh: Inno Setup starts powershell.exe for sign.ps1, and a
        # powershell.exe started through another program under pwsh inherits pwsh's module path
        # and loses the Cert: drive.
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $exe = Join-Path $stage 'Gourdian.exe'
          Copy-Item bin\gourdian.exe $exe
          Copy-Item installer\Gourdian.iss, installer\sign.ps1, installer\README.txt, installer\icon.ico, installer\wizard*.bmp, LICENSE, THIRD_PARTY_NOTICES.txt $stage
          $sign = Join-Path $stage 'sign.ps1'
          if ($env:SIGN -eq 'true') {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $sign $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Inno Setup signs the installer and uninstaller with the same script ($q is a quote, $f the file).
            $tool = '/Sgourdian=powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $q' + $sign + '$q $f'
            & $env:ISCC /Q "/DAppVersion=$version" $tool (Join-Path $stage 'Gourdian.iss')
          } else {
            & $env:ISCC /Q "/DAppVersion=$version" /DUnsigned (Join-Path $stage 'Gourdian.iss')
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $stage "Gourdian-Setup-$version.exe"
          if ($env:SIGN -eq 'true') {
            foreach ($file in $exe, $setup) {
              $status = (Get-AuthenticodeSignature $file).Status
              if ($status -ne 'Valid') { throw "$file signature is $status" }
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup dist\
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/Gourdian-Setup-*.exe
          if-no-files-found: error

  publish:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # A signed record that these files were built here from this tag: gh attestation verify.
      - uses: actions/attest@v4
        with:
          subject-path: 'out/*'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*
          --repo "$GITHUB_REPOSITORY"
          --title "Gourdian ${GITHUB_REF_NAME#v}"
          --generate-notes
