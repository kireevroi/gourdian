<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gourdian · Rules</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<style>
  .layout { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar input[type=search] { flex: 1; min-width: 140px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .filters button { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .filters button.on { color: var(--text); border-color: var(--accent); }
  .list { display: grid; gap: 4px; max-height: calc(100vh - 230px); overflow-y: auto; padding-right: 4px; }
  .cat { margin: 10px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .folder { margin-top: 10px; border-top: 1px solid var(--border); }
  .folder > summary { cursor: pointer; padding: 8px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .folder > summary:hover { color: var(--text); }
  .folder .body { margin: 0 0 4px 5px; padding-left: 8px; border-left: 1px solid var(--border); }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 7px 9px; border-radius: 8px; background: var(--panel-2); cursor: pointer; border: 1px solid transparent; }
  .item.on { border-color: var(--accent); }
  .item.off .title { color: var(--muted); }
  .item small { display: block; color: var(--muted); font-size: 12px; }
  .item .badges { display: inline-flex; gap: 4px; margin-left: 4px; }

  .editor h1 { font-size: 18px; margin: 0; }
  .block { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .block > .label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--accent); margin-bottom: 8px; }
  .line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .line > label { color: var(--text-2); }
  .cond { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.2fr) auto auto; gap: 6px; align-items: center; margin: 6px 0; }
  .cond > * { min-width: 0; width: 100%; }
  @media (max-width: 700px) { .cond { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .cond .live { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .cond .live.ok { color: var(--good); } .cond .live.no { color: var(--warn); }
  .cond .between { display: flex; gap: 4px; } .cond .between input { width: 50%; }
  input.short { width: 90px; }
  .roles { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .roles label { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); font-size: 13px; }
  .fires { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
  .fires li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--panel-2); font-size: 13px; }
  .param { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin: 6px 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn.danger { border-color: #6b2a2a; color: #ffb3b3; }
  .result.bad { color: #ffb3b3; margin-top: 6px; }
  .placeholder { color: var(--muted); padding: 40px 10px; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="layout">
    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search rules" aria-label="Search rules">
        <button class="btn primary" id="new">New rule</button>
      </div>
      <div class="toolbar">
        <select id="template" aria-label="Start from a template"><option value="">Start from a template…</option></select>
        <a class="btn small" href="/api/rules/export" download>Export</a>
        <label class="btn small">Import<input type="file" id="import" accept=".json,application/json" hidden></label>
      </div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </section>

    <section class="card editor" id="editor"><div class="placeholder">Pick a rule to change it, or make a new one.</div></section>
  </div>
</main>

<datalist id="item-list"></datalist>
<datalist id="hero-list"></datalist>

<script type="module" src="/js/rules.js"></script>
</body>
</html>
